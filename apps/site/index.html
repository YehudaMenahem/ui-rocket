<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F9E5CE" />
    <meta
      name="description"
      content="Rocket UI — Retro Launch design system. Accessible React components with cream, navy, rust and mustard."
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Rocket UI</title>
    <script>
      (function () {
        var key = 'rocket-theme';
        var legacy = 'segfault-theme';
        var stored = localStorage.getItem(key);
        if (!stored) {
          stored = localStorage.getItem(legacy);
          if (stored === 'dark' || stored === 'light') {
            localStorage.setItem(key, stored);
            localStorage.removeItem(legacy);
          }
        }
        var theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
